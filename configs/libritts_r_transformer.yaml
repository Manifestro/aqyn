# Reference for libritts_r_cfc: causal Transformer backbone at a matched budget (~71M params),
# same data, batch and schedule.
data:
  root: data/libritts_r_tokens
  max_frames_per_batch: 3000
  num_workers: 4
model:
  layers: [attn, attn, attn, attn, attn, attn, attn, attn, attn, attn, attn, attn, attn, attn]
  audio_pos_emb: true
train:
  out_dir: runs/libritts_r_transformer
  max_steps: 100000
