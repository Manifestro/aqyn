# Hybrid for libritts_r_cfc: CfC + causal local self-attention (8 s window).
# Same data, batch and schedule as the CfC run.
data:
  root: data/libritts_r_tokens
  max_frames_per_batch: 3000
  num_workers: 4
model:
  layers: [cfc, cfc, local, cfc, cfc, local, cfc, cfc, local, cfc, cfc, local]
  local_window: 100
train:
  out_dir: runs/libritts_r_hybrid
  max_steps: 100000
