[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimicfc"
version = "0.1.0"
description = "Streaming text-to-speech research with CfC networks over Mimi codec tokens"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "numpy",
    "soundfile",
    "soxr",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
eval = ["jiwer"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM115"]  # formatter handles line length; the log file stays open for a run
